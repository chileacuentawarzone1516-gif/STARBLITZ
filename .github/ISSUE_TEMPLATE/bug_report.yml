name: Error
description: Informa de un fallo de STARBLITZ
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar: no adjuntes tokens, claves, rutas personales ni páginas con derechos de autor.
        Para vulnerabilidades usa SECURITY.md, no este formulario.
  - type: dropdown
    id: producto
    attributes:
      label: Producto
      options: [Desktop (Windows), Mobile (Android), Motor Python, Documentación, Otro]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo (sistema, RAM, GPU o procesador)
  - type: input
    id: modelo
    attributes:
      label: Modelo de lenguaje y cuantización usados (si aplica)
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué ocurrió
    validations:
      required: true
  - type: textarea
    id: registros
    attributes:
      label: Registros (opcional; revisa que no contengan datos personales)
      render: text
  - type: checkboxes
    id: privacidad
    attributes:
      label: Confirmaciones
      options:
        - label: He revisado que no incluyo secretos, datos personales ni páginas con derechos de autor.
          required: true
